<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- Inline SVG favicon so the browser never requests /favicon.ico (the proxy
         root 400s it). Orange square + D, matching the brutalist accent. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff6308'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' font-weight='bold' text-anchor='middle' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E" />
    <title>Dottie Analytics</title>
    <!-- Apply theme before paint to avoid a flash. Dark unless explicitly light. -->
    <script>
      (function () {
        document.documentElement.classList.add('theme-brutalist');
        var t = localStorage.getItem('dottie_theme');
        if (t ? t === 'dark' : true) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      html, body { background: #000; margin: 0; height: 100%; }
      html:not(.dark) body { background: #fafafa; }
      #root { opacity: 0; }
    </style>
    <script defer type="module" src="/src/main.tsx"></script>
  </head>
  <body style="overscroll-behavior: none;">
    <div id="root"></div>
  </body>
</html>
